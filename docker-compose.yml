version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chirpy-postgres
    environment:
      POSTGRES_USER: chirpy_user
      POSTGRES_PASSWORD: chirpy_password
      POSTGRES_DB: chirpy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpy_user -d chirpy"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chirpy-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://chirpy_user:chirpy_password@postgres:5432/chirpy?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_me}
      POLKA_KEY: ${POLKA_KEY:-polka_key_example}
      PLATFORM: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql/schema:/migrations
    command: >
      sh -c "goose -dir /migrations postgres '$$DB_URL' up && ./chirpy"

volumes:
  postgres_data:
